<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расчёт оптимального распределения ресурсов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
      body {
        font-family: "LXGW WenKai Mono TC";
        margin: 20px;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 20px;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding-left: 3px;
        padding-right: 3px;
        text-align: center;
      }
      .prc_input {
        margin: 20px;
      }
      input {
        width: 160px;

      }
      .list-group-item {
  cursor: pointer;
  transition: background 0.2s ease-in-out;
}

.list-group-item:hover {
  background: #aad5ff; /* Светло-серый цвет при наведении */
}
    </style>
  </head>
  <body class="">
    <div class="container-fluid">

      <h1 class="text-center mb-4">
          Расчёт оптимального распределения ресурсов
      </h1>
      <div class="row">
        <!-- Вывод данных из БД -->
        <div class="col-3" id="dbDiv">
          Сохранённое
        </div>
        <!-- Таблица ввода -->
        <div class="col-8">
          <!-- Верхняя часть с количеством проектов/вариантов -->
          <div class="Counts">
            <label for="projectCountInput">Количество проектов:</label>
            <input
              type="number"
              style="width: 50px"
              id="projectCountInput"
              value="4"
              min="1"
            />
            <label for="varCount">Количество вариантов:</label>

            <input
              type="number"
              id="varCountInput"
              value="5"
              min="1"
              style="width: 50px"
            />
            <button
              type="button"
              onclick="changeSize()"
              class="btn btn-outline-dark"
              id="projectCountButton"
            >
              Применить
            </button>
            <button id="openSaveModalBtn" class="btn btn-primary">
              <i class="fa-regular fa-floppy-disk"></i> Сохранить
            </button>
          </div>
          <!-- Таблица -->
          <div class="table-responsive mb-2">

              id="dataTable"
              class="border border-2 border-black table table-hover">

                  <td>

                </tr>
                <tr>
                  <td>
                    <input type="number" step="0.01" value="14910.4813499606" />

                  <td>
                    <input type="number" step="0.01" value="9353.05656670137" />

                  <td>
                    <input type="number" step="0.01" value="8417.75091003123" />

                  <td>
                    <input type="number" step="0.01" value="3741.22262668055" />

                  <td>
                    <input type="number" step="0.01" value="5611.83394002082" />
                  </td>
                </tr>
                <tr>
                  <td>
                    <input type="number" step="0.01" value="22365.722024941" />
                  </td>
                  <td>
                    <input type="number" step="0.01" value="8598.07696588072" />
                  </td>
                  <td>

                  </td>
                  <td>
                    <input type="number" step="0.01" value="5471.50352374228" />

                </tr>
              </tbody>
            </table>
          </div>
            <button onclick="start()" class="btn btn-outline-dark w-100 mb-4">
              Расчитать
            </button>

          
      
          <!--Для вывода расчётной таблицы -->
          <div id="results" class="d-flex justify-content-center"></div>
          <!--Ответ -->
          <div id="answer" class="d-flex justify-content-center flex-column"></div>
        </div>

      </div>


    <!-- Модальное окно превью-->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="previewModalLabel">Предпросмотр данных</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <p id="previewText"></p>
            <p id="previewTime"></p>

            <div class="table-responsive mb-2">
              <table
                id="previewTable"
                class="border border-2 border-black table table-hover">
              </table>
            </div>
            
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            <button type="button" class="btn btn-primary" id="applyDataBtn">Применить</button>
          </div>
        </div>
      </div>
    </div>

        <!-- Модальное окно -->
    <div class="modal fade" id="saveModal" tabindex="-1" aria-labelledby="saveModalLabel" aria-hidden="true">
      <div class="modal-dialog ">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="saveModalLabel">Сохранить данные</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <label for="saveNameInput" class="form-label">Введите название:</label>
            <input type="text" class="form-control" id="saveNameInput" placeholder="Название">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="button" class="btn btn-primary" id="confirmSaveBtn">Сохранить</button>
          </div>
        </div>
      </div>
    </div>



    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
